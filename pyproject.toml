[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "entity-resolution-pipeline"
version = "1.0.0"
description = "Two-stage entity resolution: FAISS blocking + trained Fellegi--Sunter scoring (train with Splink, infer with a lightweight scorer)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    # ---- Embedding / vector layer ----
    "langchain-core==1.5.1",
    "langchain-huggingface==1.2.2",
    "sentence-transformers==5.6.1",
    "faiss-cpu==1.14.3",
    "numpy==2.4.6",
    "scipy==1.18.0",
    # ---- Probabilistic linkage (train with Splink, infer with scorer.py) ----
    "splink==4.0.16",
    "duckdb==1.5.5",
    "altair==6.2.2",
    "RapidFuzz==3.14.5",
    "scikit-learn==1.9.0",
    # ---- Data generation / analysis / reporting ----
    "Faker==40.36.0",
    "pandas==3.0.5",
    "matplotlib==3.11.1",
    "tqdm==4.69.1",
    "python-dotenv==1.2.2",
    # ---- Pinned transitive stack (torch / transformers / hub) ----
    "torch==2.13.0",
    "transformers==5.5.4",
    "tokenizers==0.22.2",
    "safetensors==0.7.0",
    "huggingface-hub==1.21.0",
    "filelock==3.32.0",
    "fsspec==2026.6.0",
    "regex==2026.7.19",
    "requests==2.34.2",
    "PyYAML==6.0.3",
    # ---- Pinned transitive stack (langchain / splink / pandas) ----
    "langchain==1.3.14",
    "langchain-community==0.4.2",
    "langchain-text-splitters==1.1.2",
    "langsmith==0.10.10",
    "orjson==3.11.9",
    "sqlglot==30.14.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-dateutil==2.9.0.post0",
    "pytz==2026.3.post1",
    "tzdata==2026.3",
    "typing_extensions==4.16.0",
    "packaging==26.2",
    # ---- Pinned transitive stack (matplotlib / scipy / sklearn) ----
    "pillow==12.3.0",
    "contourpy==1.3.3",
    "cycler==0.12.1",
    "fonttools==4.63.0",
    "kiwisolver==1.5.0",
    "pyparsing==3.3.2",
    "joblib==1.5.3",
    "threadpoolctl==3.6.0",
]

[project.optional-dependencies]
rest = [
    "fastapi==0.140.0",
    "uvicorn==0.51.0",
    "pydantic==2.13.4",
    "python-multipart==0.0.32",
]
# Pinned commit of the author's Splink RFC-decay extension (installed in the
# reference environment; used only when running decay experiments that opt into
# the extension, not by the default whitepaper suite).
rfc-decay = [
    "splinkrfc-decay @ git+https://github.com/denisrobert/SplinkRFCDecay.git@6c59a280acabce9c85dcff13a02731a4b2ed1444",
]
# OpenVINO runtime + patch for running all-MiniLM-L6-v2 through the
# sentence-transformers OpenVINO backend on Intel CPU/GPU/NPU. NOTE: optimum-intel
# caps transformers<5.6 / huggingface-hub<1.22 / safetensors<0.8.0, so the base
# pins for those three are set to the OpenVINO-compatible exact versions above.
openvino = [
    "openvino==2026.3.0",
    "openvino-tokenizers==2026.3.0.0",
    "openvino-telemetry==2025.2.0",
    "optimum==2.3.0",
    "optimum-intel==2.1.0",
    "nncf==3.3.0",
    "ninja==1.13.0",
    "pydot==3.0.4",
    "tabulate==0.10.0",
    # pinned transitive that optimum-intel brought in
    "typer==0.25.1",
]

[tool.setuptools]
# Core pipeline modules live in a real ``src`` package
# (``entity_resolution``); the experiment scripts under ``experiments/`` are
# run as scripts with the repo root on ``sys.path`` and are not installed.
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["entity_resolution*"]